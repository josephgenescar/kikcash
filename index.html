.ll{background:transparent;display:flex;flex-direction:column;justify-content:center;padding:5rem;position:relative;overflow:hidden;z-index:1}.ll-bg{display:none}.ll>*{position:relative;z-index:1}
.ll::before{content:'';position:absolute;top:-120px;right:-120px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.15),transparent 65%);pointer-events:none}
.ll-pill{display:inline-flex;align-items:center;gap:.5rem;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.25);border-radius:100px;padding:.35rem 1rem;font-size:.7rem;font-weight:700;color:var(--y);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2.5rem;width:fit-content}
.ll-logo{font-family:'Syne',sans-serif;font-size:3.5rem;font-weight:800;color:var(--y);letter-spacing:-.04em;line-height:1;margin-bottom:.8rem}
.ll-sub{font-size:1rem;color:rgba(255,255,255,.45);margin-bottom:3rem;line-height:1.7}
.ll-f{display:flex;align-items:center;gap:.8rem;margin-bottom:.8rem}
.ll-i{width:36px;height:36px;border-radius:10px;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.15);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.ll-t{font-size:.85rem;color:rgba(255,255,255,.6)}
.lr{display:flex;align-items:center;justify-content:center;padding:3rem 2rem;background:rgba(245,247,250,.96);backdrop-filter:blur(12px);position:relative;z-index:1}
.lbox{width:100%;max-width:400px}
.lb-t{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--text);margin-bottom:.3rem}
.lb-s{color:var(--muted);font-size:.85rem;margin-bottom:2.5rem}
.fl{display:block;font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.fin{width:100%;background:var(--card);border:1.5px solid var(--border);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:.9rem;padding:.85rem 1.1rem;border-radius:var(--r2);outline:none;transition:all .2s;margin-bottom:1.2rem}
.fin:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(245,197,24,.12)}
.fin::placeholder{color:var(--muted)}
.btn-login{width:100%;background:var(--navy);color:#FFF;font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;padding:1rem;border:none;border-radius:var(--r2);cursor:pointer;transition:all .25s;box-shadow:0 4px 16px rgba(13,27,42,.25)}
.btn-login:hover:not(:disabled){background:var(--navy2);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.lerr{background:var(--redl);border:1px solid rgba(220,38,38,.2);color:var(--red);border-radius:var(--r3);padding:.7rem 1rem;font-size:.82rem;margin-bottom:1.2rem;display:none}
#pg-app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200}
.sb-top{padding:1.6rem 1.4rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--y);display:flex;align-items:center;gap:.4rem}
.sb-dot{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 8px var(--y)}
.sb-user{padding:1rem 1.4rem;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:.8rem;cursor:pointer;transition:background .15s}
.sb-user:hover{background:rgba(255,255,255,.04)}
.sb-av{width:36px;height:36px;border-radius:10px;background:var(--yg);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;color:var(--navy);font-size:.82rem;flex-shrink:0}
.sb-nm{font-size:.85rem;font-weight:600;color:#FFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-rl{font-size:.63rem;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.08em}
.sb-nav{flex:1;padding:.75rem 0;overflow-y:auto}
.sb-sec{font-size:.58rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.2);padding:.8rem 1.4rem .3rem;margin-top:.4rem}
.sb-item{display:flex;align-items:center;gap:.75rem;padding:.7rem 1.4rem;cursor:pointer;color:rgba(255,255,255,.45);font-size:.84rem;font-weight:500;border:none;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;width:100%;text-align:left;border-left:2.5px solid transparent;transition:all .15s}
.sb-item:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.05)}
.sb-item.active{color:var(--y);background:rgba(245,197,24,.08);border-left-color:var(--y)}

#pg-app .sc-s{color:#81909a}
#pg-app .bg{gap:1.15rem}
#pg-app .bg>div{min-height:180px;box-shadow:0 16px 30px rgba(13,46,65,.16)!important;transition:transform .3s,box-shadow .3s}
#pg-app .bg>div:hover{transform:translateY(-4px);box-shadow:0 21px 38px rgba(13,46,65,.22)!important}
#pg-app .card{border-color:rgba(18,61,83,.1);box-shadow:0 8px 24px rgba(13,46,65,.055);transition:box-shadow .25s,border-color .25s}
#pg-app .card:hover{border-color:rgba(245,197,24,.35);box-shadow:0 12px 30px rgba(13,46,65,.09)}
#pg-app .btn{transition:transform .2s,box-shadow .2s,background .2s}
#pg-app .btn:hover:not(:disabled){box-shadow:0 7px 16px rgba(13,46,65,.12)}
#pg-app tbody tr{transition:background .18s,transform .18s}
#pg-app tbody tr:hover{transform:translateX(2px)}
@keyframes workspaceIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:900px){#pg-app .content{padding:.9rem}#pg-app .sg{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}#pg-app .sg .sc{padding:1rem}.sc-v{font-size:1.4rem!important}#pg-app .bg>div{min-height:150px;padding:1.25rem!important}}
@media(max-width:520px){#pg-app .sc-l{font-size:.55rem;letter-spacing:.08em}#pg-app .sc-s{font-size:.65rem}#pg-app .bg>div{min-height:135px}.b-a{font-size:1.65rem}}
@media(max-width:600px){
  html,body{width:100%;min-width:0;overflow-x:hidden}
  #pg-login{display:block;min-height:100svh;padding:0;background:#fffdf1;overflow:visible}
  #pg-login .ll{display:none}
  #pg-login .lr{display:flex;align-items:flex-start;justify-content:center;width:100%;min-height:100svh;max-width:none;padding:2.25rem 1.25rem 2rem;border:0;border-radius:0;background:#fffdf1;box-shadow:none}
  #pg-login .lbox{width:100%;max-width:390px}
  #pg-login .login-brand-form{width:min(190px,60vw);margin:0 auto 1.35rem}
  #pg-login .lb-t{font-size:1.75rem;text-align:center}
  #pg-login .lb-s{max-width:none;text-align:center;margin-bottom:1.75rem}
  #pg-login .fin{font-size:1rem;padding:.95rem 1rem}
  #pg-login .btn-login{min-height:50px}
  #pg-app .topbar{padding:.7rem .75rem}
  #pg-app .tp-t{font-size:.95rem}
  #pg-app .tp-d{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:.3rem .6rem;font-size:.68rem}
  #pg-app .content{padding:.75rem}
  #pg-app .card{padding:1rem;border-radius:12px}
  #pg-app .gr2,#pg-app .gr3{grid-template-columns:1fr}
  #toast{left:.75rem;right:.75rem;bottom:1rem;max-width:none}
}
@media print{body>*:not(#pg-app){display:none}.sidebar,.topbar,.macts{display:none!important}.ticket{border:2px solid #000}}
</style>

function pgTx(){const b=CU.bal||{moncash:0,natcash:0};return`<div class="card"><div class="card-t">➕ Nouvo Tranzaksyon</div><div class="ai">💡 Kapital ou — MonCash: <strong>${fmt(b.moncash)} HTG</strong> &nbsp;|&nbsp; NatCash: <strong>${fmt(b.natcash)} HTG</strong></div><div class="gr2"><div class="fg"><label class="flab">Non Kliyan</label><input class="fi" id="tn" placeholder="egz: Jean Baptiste"></div><div class="fg"><label class="flab">N° Kliyan</label><input class="fi" id="tno" placeholder="egz: 37570130"></div></div><div class="gr2"><div class="fg"><label class="flab">Sèvis</label><select class="fs" id="tsv" onchange="txC()"><option value="MonCash">💳 MonCash</option><option value="NatCash">💳 NatCash</option></select></div><div class="fg"><label class="flab">Tip Operasyon</label><select class="fs" id="tty" onchange="txC()"><option value="Depot">⬇ Dépôt</option><option value="Retrait">⬆ Retrait</option></select></div></div><div class="gr2"><div class="fg"><label class="flab">Montan (HTG)</label><input class="fi" id="tmt" type="number" min="0" placeholder="0.00" oninput="txC()"></div><div class="fg" id="fgfr"><label class="flab">Frè (HTG)</label><input class="fi" id="tfr" type="number" min="0" placeholder="0.00" oninput="txC()"></div></div><div class="fp" id="fp"><div class="fp-r"><span>Montan</span><span id="pm">—</span></div><div class="fp-r"><span>Frè</span><span id="pf">—</span></div><div class="fp-t"><span>Total Kliyan Peye</span><span id="pt">—</span></div></div><div style="margin-top:1.2rem"><button class="btn btn-n btn-fw" id="btnTx" style="font-size:.95rem;padding:.95rem;font-family:'Syne',sans-serif;font-weight:700" onclick="subTx()">✓ Valide &amp; Jenere Tiket</button></div></div>`;}
function txC(){const ty=$('tty'),fg=$('fgfr'),fp=$('fp');if(!ty||!fg||!fp)return;const isR=ty.value==='Retrait';fg.style.opacity=isR?'1':'.35';fg.style.pointerEvents=isR?'auto':'none';if(!isR){const tf=$('tfr');if(tf)tf.value='';}const m=parseFloat($('tmt')?.value)||0;if(m>0){const fr=isR?(parseFloat($('tfr')?.value)||0):0;fp.style.display='block';$('pm').textContent=fmt(m)+' HTG';$('pf').textContent=fmt(fr)+' HTG';$('pt').textContent=fmt(isR?m+fr:m)+' HTG';}else fp.style.display='none';}
async function subTx(){
  const nom=$('tn').value.trim(),noc=$('tno').value.trim(),svc=$('tsv').value,typ=$('tty').value;
  const mt=parseFloat($('tmt').value)||0,fr=typ==='Retrait'?(parseFloat($('tfr').value)||0):0;

  const b=$('btnTx');b.disabled=true;b.innerHTML='<span class="spin"></span> Anrejistreman...';
  const d=await rq('POST','/transactions',{nomClient:nom,noClient:noc,service:svc,type:typ,montant:mt,frais:fr});
  b.disabled=false;b.innerHTML='✓ Valide &amp; Jenere Tiket';
  if(!d.ok){toast(d.msg,'error');return;}
  CU.bal=d.balances;toast('✓ Tranzaksyon anrejistre','success');showTk(d.transaction);
}

  const msgs=await getMsgs();
  return msgs.filter(m=>!m.readBy?.includes(userId)).length;
}

  if(!CU)return;
  const isA=CU.role==='superadmin';
  let count=0;
  if(isA){
    // Admin wè mesaj yo voye — pa bezwen badge
    count=0;
  } else {
    count=await getUnreadCount(CU._id);
  }
  // Update bell
  const bell=$('bell-badge');
  if(bell){bell.style.display=count>0?'flex':'none';bell.textContent=count>99?'99+':count;}

  const users=(usersRes.users||[]).filter(u=>u.username!=='superadmin');
  const msgs=(await getMsgs()).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  
  const userOpts=users.map(u=>`<option value="${u._id}">${u.nom} (@${u.username})</option>`).join('');
  
  return`
  <div class="compose-box">
    <div class="compose-t">📢 Kreye Anons oswa Mesaj Prive</div>
    <div class="gr2" style="margin-bottom:.85rem">
      <div class="fg">
        <label class="flab" style="color:rgba(255,255,255,.5)">Destinatè</label>
        <select class="fs" id="msg-to">
          <option value="all">📢 Tout Itilizatè</option>
          ${userOpts}
        </select>
      </div>
      <div class="fg">
        <label class="flab" style="color:rgba(255,255,255,.5)">Sijè</label>
        <input class="fi" id="msg-subj" placeholder="Sijè mesaj la...">
      </div>
    </div>
    <div class="fg" style="margin-bottom:1rem">
      <label class="flab" style="color:rgba(255,255,255,.5)">Mesaj</label>
      <textarea class="fi" id="msg-body" rows="4" placeholder="Tape mesaj ou isit..." style="resize:vertical;line-height:1.6"></textarea>
    </div>
    <div style="display:flex;gap:.75rem">
      <button class="btn btn-y" onclick="sendMsg()" id="btn-send" style="font-family:'Syne',sans-serif;font-weight:700;padding:.8rem 2rem">📤 Voye Mesaj</button>
      <div id="send-confirm" style="display:none;align-items:center;gap:.4rem;color:var(--y);font-size:.82rem;font-weight:600">✓ Mesaj voye!</div>
    </div>
  </div>

  <div class="card">
    <div class="sh">
      <div class="st">📬 Mesaj Voye (${msgs.length})</div>
      ${msgs.length?`<button class="btn btn-r btn-sm" onclick="delAllMsgs()">🗑 Efase Tout</button>`:''}
    </div>
    ${msgs.length?msgs.map(m=>{
      const toLabel=m.to==='all'?'📢 Tout Itilizatè':`👤 ${m.toName}`;
      const readCount=m.readBy?.length||0;
      return`<div class="msg-card">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem">
          <div style="flex:1">
            <div class="msg-title">${m.subj}</div>
            <div class="msg-body" style="margin-top:.4rem">${m.body}</div>
          </div>
          <div style="flex-shrink:0;text-align:right">
            <div style="font-size:.7rem;font-weight:700;color:var(--y);background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.2);border-radius:6px;padding:.2rem .6rem;margin-bottom:.4rem">${toLabel}</div>
            <div style="font-size:.65rem;color:var(--muted)">${new Date(m.ts).toLocaleString('fr-HT')}</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:.5rem;margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--border)">
          <span style="font-size:.7rem;color:var(--green)">✓ ${readCount} moun li li</span>
          <button class="btn btn-r btn-sm" style="margin-left:auto" onclick="delMsg('${m.id}')">🗑</button>
        </div>
      </div>`;
    }).join(''):`<div class="msg-empty"><div class="ei">📭</div>Pa gen mesaj voye ankò</div>`}
  </div>`;
}

async function sendMsg(){
  const to=$('msg-to').value;
  const toName=$('msg-to').selectedOptions[0].text;
  const subj=$('msg-subj').value.trim();
  const body=$('msg-body').value.trim();
  if(!subj){toast('Antre sijè mesaj la','error');return;}
  if(!body){toast('Ekri mesaj la','error');return;}
  
  const result=await rq('POST','/messages',{to,toName,subj,body});
  if(!result.ok){toast(result.msg||'Mesaj la pa ka voye','error');return;}
  
  $('msg-subj').value='';$('msg-body').value='';
  const conf=$('send-confirm');conf.style.display='flex';
  setTimeout(()=>conf.style.display='none',3000);
  toast(`Mesaj voye bay ${toName}`,'success');
}

async function delMsg(id){
  const result=await rq('DELETE','/messages/'+id);
  if(!result.ok){toast(result.msg||'Mesaj la pa ka efase','error');return;}
  nav('adm-msgs');
}
async function delAllMsgs(){
  if(!confirm('Efase tout mesaj?'))return;
  const result=await rq('DELETE','/messages');
  if(!result.ok){toast(result.msg||'Mesaj yo pa ka efase','error');return;}
  nav('adm-msgs');
}

// User page — see their messages
async function pgMsgs(){
  const msgs=(await getMsgs()).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  
  // Mark all as read
  await Promise.all(msgs.filter(m=>!m.readBy?.includes(CU._id)).map(m=>rq('PATCH','/messages/'+m.id+'/read')));
  setTimeout(updateBadges,200);
  
  const unread=msgs.filter(m=>!m.readBy?.includes(CU._id));
  
  return`
  <div class="card" style="background:linear-gradient(135deg,var(--navy),var(--navy2));border:none;margin-bottom:1.5rem">
    <div style="display:flex;align-items:center;gap:1rem">
      <div style="font-size:2.5rem">🔔</div>
      <div>
        <div style="font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;color:#fff">Notifikasyon Ou</div>
        <div style="font-size:.82rem;color:rgba(255,255,255,.5);margin-top:.2rem">${msgs.length} mesaj total${unread.length>0?` &nbsp;·&nbsp; <span style="color:var(--y);font-weight:700">${unread.length} nouvo</span>`:' &nbsp;·&nbsp; tout li'}</div>
      </div>
    </div>
  </div>
  
  ${msgs.length?msgs.map(m=>{
    const wasUnread=!m.readBy?.includes(CU._id);
    return`<div class="msg-card ${wasUnread?'unread':''}">
      <div style="display:flex;align-items:flex-start;gap:.75rem">
        ${wasUnread?'<div class="msg-dot" style="margin-top:.35rem;flex-shrink:0"></div>':'<div style="width:8px;flex-shrink:0"></div>'}
        <div style="flex:1">
          <div class="msg-title">${m.subj}</div>
          <div class="msg-body">${m.body}</div>
          <div class="msg-meta">
            <span class="msg-from">✉️ ${m.fromName}</span>
            <span class="msg-date">${new Date(m.ts).toLocaleString('fr-HT')}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join(''):`<div class="msg-empty"><div class="ei">🔕</div>Pa gen notifikasyon pou ou ankò</div>`}`;
}

// Check badges every 30 seconds
setInterval(updateBadges, 30000);

autoLogin();
</script>
